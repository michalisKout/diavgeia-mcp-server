name: PR Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-lint:
    name: Build, Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "23"

      - name: Run TypeScript type check
        run: pnpm run check

      - name: Run linter
        run: pnpm run lint

      - name: Build local version
        run: pnpm run build:local

      - name: Check for build artifacts
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Build failed: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build successful: dist/index.js created"

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "20"

      - name: Check formatting
        run: pnpm run format:check

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  summary:
    name: PR Check Summary
    runs-on: ubuntu-latest
    needs: [build-and-lint, format-check]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.build-and-lint.result }}" != "success" ] || [ "${{ needs.format-check.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"
