name: Smithery Deploy

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smithery-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "23"

      - name: Run lint
        run: pnpm run lint

      - name: Build local MCP server
        run: pnpm run build:local

      - name: Verify build artifact
        run: |
          if [ ! -f "dist/local.js" ]; then
            echo "Build failed: dist/local.js not found"
            exit 1
          fi

      - name: Run tests
        run: pnpm run test

  publish-smithery:
    name: Publish to Smithery
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "23"

      - name: Validate Smithery secrets
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          SMITHERY_SERVER_URL: ${{ secrets.SMITHERY_SERVER_URL }}
          SMITHERY_SERVER_NAME: ${{ secrets.SMITHERY_SERVER_NAME }}
        run: |
          missing=0

          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "Missing required secret: SMITHERY_API_KEY"
            missing=1
          fi

          if [ -z "$SMITHERY_SERVER_URL" ]; then
            echo "Missing required secret: SMITHERY_SERVER_URL"
            missing=1
          fi

          if [ -z "$SMITHERY_SERVER_NAME" ]; then
            echo "Missing required secret: SMITHERY_SERVER_NAME"
            missing=1
          fi

          exit "$missing"

      - name: Publish MCP server to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          SMITHERY_SERVER_URL: ${{ secrets.SMITHERY_SERVER_URL }}
          SMITHERY_SERVER_NAME: ${{ secrets.SMITHERY_SERVER_NAME }}
        run: |
          npx -y smithery@latest mcp publish "$SMITHERY_SERVER_URL" -n "$SMITHERY_SERVER_NAME"
