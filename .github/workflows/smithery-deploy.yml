name: Smithery Deploy

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smithery-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "23"

      - name: Run lint
        run: pnpm run lint

      - name: Build local MCP server
        run: pnpm run build:local

      - name: Verify build artifact
        run: |
          if [ ! -f "dist/local.js" ]; then
            echo "Build failed: dist/local.js not found"
            exit 1
          fi

      - name: Run tests
        run: pnpm run test

  publish-smithery:
    name: Deploy Worker & Publish to Smithery
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "23"

      - name: Validate Smithery secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          SMITHERY_SERVER_URL: ${{ secrets.SMITHERY_SERVER_URL }}
          SMITHERY_SERVER_NAME: ${{ secrets.SMITHERY_SERVER_NAME }}
        run: |
          missing=0

          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "Missing required secret: SMITHERY_API_KEY"
            missing=1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi

          if [ -z "$SMITHERY_SERVER_URL" ]; then
            echo "Missing required secret: SMITHERY_SERVER_URL"
            missing=1
          elif ! node -e 'const url = new URL(process.env.SMITHERY_SERVER_URL); if (!url.pathname.endsWith("/mcp")) process.exit(1);'; then
            echo "SMITHERY_SERVER_URL must point to the Streamable HTTP MCP endpoint, for example: https://your-worker.workers.dev/mcp"
            missing=1
          fi

          if [ -z "$SMITHERY_SERVER_NAME" ]; then
            echo "Missing required secret: SMITHERY_SERVER_NAME"
            missing=1
          fi

          exit "$missing"

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

      - name: Verify deployed Smithery server card
        env:
          SMITHERY_SERVER_URL: ${{ secrets.SMITHERY_SERVER_URL }}
        run: |
          BASE_URL="$(node -e 'const url = new URL(process.env.SMITHERY_SERVER_URL); process.stdout.write(`${url.origin}/.well-known/mcp/server-card.json`);')"
          curl --fail --silent --show-error --location "$BASE_URL" > /tmp/server-card.json
          node -e 'const fs = require("fs"); const card = JSON.parse(fs.readFileSync("/tmp/server-card.json", "utf8")); if (!card.name || !Array.isArray(card.tools)) process.exit(1);'

      - name: Publish MCP server to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          SMITHERY_SERVER_URL: ${{ secrets.SMITHERY_SERVER_URL }}
          SMITHERY_SERVER_NAME: ${{ secrets.SMITHERY_SERVER_NAME }}
        run: |
          CONFIG_SCHEMA="$(node -e 'const fs = require("fs"); const schema = JSON.parse(fs.readFileSync("mcp-config-schema.json", "utf8")); delete schema["$schema"]; process.stdout.write(JSON.stringify(schema));')"
          npx -y smithery@latest mcp publish "$SMITHERY_SERVER_URL" -n "$SMITHERY_SERVER_NAME" --config-schema "$CONFIG_SCHEMA"
